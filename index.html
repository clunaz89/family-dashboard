<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#355c52"><link rel="manifest" href="manifest.json"><title>Luna Family Dashboard</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#24231f;--muted:#74716a;--line:#ded9cf;--accent:#355c52}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header,main,nav{max-width:1050px;margin:auto}header{padding:22px 20px 12px;display:flex;justify-content:space-between;gap:12px}h1{margin:3px 0;font-size:27px}.small{font-size:13px;color:var(--muted)}nav{display:flex;gap:8px;padding:0 20px 16px;overflow:auto}button,input,select{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 14px}button.primary,.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{padding:0 20px 30px}.kids{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:15px}.kid{text-align:left}.kid span,.kid strong{display:block}.card,.row{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px}.grow{flex:1}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.hide{display:none!important}.bar{height:9px;background:#ebe7df;border-radius:9px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--accent)}.form{display:grid;gap:10px}.form input,.form select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{border:1px solid var(--line);padding:8px;border-radius:10px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.modal .card{width:min(420px,100%)}@media(max-width:720px){.grid{grid-template-columns:1fr}.kids{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div><div class=small id=date></div><h1>Luna Family Dashboard</h1><div class=small id=cloud>Connecting to family cloud…</div></div><div><b>Sunday Payday</b><div class=small>$60 weekly maximum</div></div></header>
<nav><button data-tab=today class=active>Today</button><button data-tab=payday>Payday</button><button data-tab=calendar>Calendar</button><button id=parentBtn>🔒 Parent</button></nav>
<main><section id=today><div class=kids id=kids></div><div class=grid><div><div class=card><b id=who></b><div class=small>Tap Done when finished. A parent approves it before it counts.</div></div><div id=chores></div></div><div><div class=card><b>Weekly progress</b><div id=progress></div></div></div></div></section>
<section id=payday class=hide><div class=card><h2>Sunday Payday</h2><div id=payout></div></div></section>
<section id=calendar class=hide><div class=card><h2>Family Calendar</h2><form id=eventForm class=form><input id=eventDate type=date required><input id=eventText placeholder="Event" required><button class=primary>Add event</button></form></div><div id=events></div></section>
<section id=parent class=hide><div class=grid><div><div class=card><h2>Pending approvals</h2><div id=pending></div></div><div class=card><h2>Chore Library</h2><div id=library></div></div></div><div><div class=card><h2>Add a chore</h2><form id=choreForm class=form><input id=choreName placeholder="Chore name" required><select id=choreWeight><option value=1>1 point — light</option><option value=2>2 points — medium</option><option value=3>3 points — heavy</option></select><input id=helperName placeholder="Sophia helper version"><div class=checks id=dayChecks></div><button class=primary>Add to rotation</button></form></div><div class=card><h2>Parent settings</h2><button id=changePin>Change PIN</button></div></div></div></section></main>
<div id=pinModal class="modal hide"><div class=card><h2 id=pinTitle>Parent PIN</h2><form id=pinForm class=form><input id=pinInput inputmode=numeric type=password maxlength=8 placeholder=PIN required><button class=primary>Continue</button><button type=button id=cancelPin>Cancel</button><div id=pinMsg class=small></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://cahdyxxzcqjfhothhsqs.supabase.co","sb_publishable_wiAPKMkpv300kZovw2j53A_zBvh2sz3");
let KIDS=[],CH=[],STAT=[],EVENTS=[],selected=0; const PINKEY="lunaParentPin";
const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const monday=d=>{let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x};
function iso(d){return d.toISOString().slice(0,10)} function dateForDay(day){let m=monday(new Date());let offset=day===0?6:day-1;m.setDate(m.getDate()+offset);return iso(m)} function assigned(k,c,d){let kid=KIDS[k],ch=CH[c];if(!kid.active_days.includes(d)||!ch.active_days.includes(d))return false;if(ch.personal)return true;let eligible=KIDS.map((x,i)=>x.active_days.includes(d)?i:null).filter(x=>x!==null),non=CH.map((x,i)=>!x.personal?i:null).filter(x=>x!==null),pos=non.indexOf(c);return eligible[(pos+d)%eligible.length]===k}
function status(k,c,d){let r=STAT.find(x=>x.kid_id===KIDS[k].id&&x.chore_id===CH[c].id&&x.chore_date===dateForDay(d));return r?r.status:"open"}
async function setStatus(k,c,d,s){let q={kid_id:KIDS[k].id,chore_id:CH[c].id,chore_date:dateForDay(d),status:s};let r=s==="open"?await db.from("chore_status").delete().eq("kid_id",q.kid_id).eq("chore_id",q.chore_id).eq("chore_date",q.chore_date):await db.from("chore_status").upsert(q,{onConflict:"kid_id,chore_id,chore_date"});if(r.error)alert(r.error.message);else await load()}
function points(k){let a=0,t=0;for(let d=0;d<7;d++)for(let c=0;c<CH.length;c++)if(assigned(k,c,d)){t+=CH[c].points;if(status(k,c,d)==="approved")a+=CH[c].points}return[a,t]} function earned(k){let[a,t]=points(k);return t?Number(KIDS[k].weekly_allowance)*a/t:0} function money(x){return "$"+x.toFixed(2)}
async function load(){let [a,b,c,d]=await Promise.all([db.from("kids").select("*").order("sort_order"),db.from("chores").select("*").eq("active",true).order("sort_order"),db.from("chore_status").select("*"),db.from("family_events").select("*").order("event_date")]);let err=[a,b,c,d].find(x=>x.error);if(err){document.querySelector("#cloud").textContent="⚠️ Cloud error";return alert(err.error.message)}KIDS=a.data;CH=b.data;STAT=c.data;EVENTS=d.data;document.querySelector("#cloud").textContent="☁️ Synced across family devices";render()}
function render(){document.querySelector("#date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});let ke=document.querySelector("#kids");ke.innerHTML="";KIDS.forEach((k,i)=>{let b=document.createElement("button");b.className="kid "+(i===selected?"active":"");b.innerHTML=`<strong>${k.name}</strong><span>${money(earned(i))} / $${Number(k.weekly_allowance).toFixed(2)}</span>`;b.onclick=()=>{selected=i;render()};ke.appendChild(b)});let ce=document.querySelector("#chores");ce.innerHTML="";document.querySelector("#who").textContent=(KIDS[selected]?.name||"")+"'s chores";let d=new Date().getDay();CH.forEach((ch,c)=>{if(!assigned(selected,c,d))return;let s=status(selected,c,d),name=KIDS[selected].helper_mode&&ch.helper_name?ch.helper_name:ch.name,r=document.createElement("div");r.className="row";r.innerHTML=`<div class=grow><b>${name}</b><div class=small>${s==="open"?ch.points+" point"+(ch.points>1?"s":""):s==="pending"?"⏳ Waiting for approval":"✓ Approved"}</div></div><button>${s==="open"?"Done":s==="pending"?"Undo":"Approved"}</button>`;r.querySelector("button").disabled=s==="approved";r.querySelector("button").onclick=()=>setStatus(selected,c,d,s==="open"?"pending":"open");ce.appendChild(r)});renderProgress();renderParent();renderEvents()}
function renderProgress(){let e=document.querySelector("#progress"),p=document.querySelector("#payout");e.innerHTML="";p.innerHTML="";let total=0;KIDS.forEach((k,i)=>{let[a,t]=points(i),x=earned(i),pct=t?100*a/t:0;total+=x;e.innerHTML+=`<div style="margin-top:13px"><div style="display:flex;justify-content:space-between"><span>${k.name}</span><b>${money(x)}</b></div><div class=bar><div class=fill style="width:${pct}%"></div></div><div class=small>${a} of ${t} weighted points approved</div></div>`;p.innerHTML+=`<div class=row><div class=grow><b>${k.name}</b></div><b>${money(x)}</b></div>`});p.innerHTML+=`<div class=row><div class=grow><b>Total earned</b></div><b>${money(total)}</b></div>`}
function renderParent(){let e=document.querySelector("#pending");e.innerHTML="";let n=0;for(let d=0;d<7;d++)KIDS.forEach((k,ki)=>CH.forEach((ch,ci)=>{if(status(ki,ci,d)==="pending"){n++;let r=document.createElement("div");r.className="row";r.innerHTML=`<div class=grow><b>${k.name}</b><div class=small>${ch.name} • ${dow[d]}</div></div><button class=primary>Approve</button>`;r.querySelector("button").onclick=()=>setStatus(ki,ci,d,"approved");e.appendChild(r)}}));if(!n)e.innerHTML="<div class=small>No chores waiting for approval.</div>";let l=document.querySelector("#library");l.innerHTML="";CH.forEach(ch=>{let r=document.createElement("div");r.className="row";r.innerHTML=`<div class=grow><b>${ch.name}</b><div class=small>${ch.points} point(s)</div></div><button>Delete</button>`;r.querySelector("button").onclick=async()=>{if(confirm("Disable this chore?")){await db.from("chores").update({active:false}).eq("id",ch.id);load()}};l.appendChild(r)})}
function renderEvents(){let e=document.querySelector("#events");e.innerHTML="";EVENTS.forEach(x=>{let r=document.createElement("div");r.className="row";r.innerHTML=`<div class=grow><b>${x.title}</b><div class=small>${x.event_date}</div></div><button>Delete</button>`;r.querySelector("button").onclick=async()=>{await db.from("family_events").delete().eq("id",x.id);load()};e.appendChild(r)})}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("main>section").forEach(x=>x.classList.add("hide"));document.querySelector("#"+b.dataset.tab).classList.remove("hide");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
parentBtn.onclick=()=>{
  pinModal.classList.remove("hide");
  pinTitle.textContent="Enter Parent PIN";
  pinInput.value="";
  pinMsg.textContent="";
};

cancelPin.onclick=()=>pinModal.classList.add("hide");

pinForm.onsubmit=async e=>{
  e.preventDefault();

  let p=pinInput.value;

  const {data,error}=await db
    .from("family_settings")
    .select("parent_pin")
    .order("id")
    .limit(1)
    .single();

  if(error){
    pinMsg.textContent="Could not check PIN.";
    console.error(error);
    return;
  }

  if(p!==data.parent_pin){
    pinMsg.textContent="Incorrect PIN.";
    return;
  }

  pinModal.classList.add("hide");
document.querySelectorAll("main > section").forEach(x=>x.classList.add("hide"));
const parentSection=document.getElementById("parent");
parentSection.classList.remove("hide");
renderParent();
};

changePin.onclick=async()=>{
  let p=prompt("New 4–8 digit PIN");

  if(!/^\d{4,8}$/.test(p||"")){
    alert("PIN must be 4–8 digits.");
    return;
  }

  const {data,error}=await db
    .from("family_settings")
    .select("id")
    .order("id")
    .limit(1)
    .single();

  if(error){
    alert("Could not change PIN.");
    console.error(error);
    return;
  }

  const result=await db
    .from("family_settings")
    .update({parent_pin:p})
    .eq("id",data.id);

  if(result.error){
    alert("Could not change PIN.");
    console.error(result.error);
    return;
  }

  alert("PIN changed.");
};eventForm.onsubmit=async e=>{e.preventDefault();let r=await db.from("family_events").insert({event_date:eventDate.value,title:eventText.value.trim()});if(r.error)alert(r.error.message);else{e.target.reset();load()}};
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach((x,i)=>dayChecks.insertAdjacentHTML("beforeend",`<label><input type=checkbox value=${i} checked> ${x}</label>`));choreForm.onsubmit=async e=>{e.preventDefault();let days=[...dayChecks.querySelectorAll("input:checked")].map(x=>+x.value),r=await db.from("chores").insert({name:choreName.value.trim(),points:+choreWeight.value,helper_name:helperName.value.trim()||null,active_days:days,personal:false,active:true,sort_order:CH.length+1});if(r.error)alert(r.error.message);else{e.target.reset();load()}};
db.channel("family").on("postgres_changes",{event:"*",schema:"public"},()=>load()).subscribe();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");load();
</script></body></html>
